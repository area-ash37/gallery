<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作品を探す/YAMATO's Factory</title>

    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/top.css">

    <!-- fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Kosugi+Maru&family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap"
        rel="stylesheet">

    <!-- slick -->
    <link rel="stylesheet" type="text/css" href="css/slick.css">
    <link rel="stylesheet" type="text/css" href="css/slick-theme.css">

    <script src="js/jquery-3.6.0.min.js"></script>
    <script src="js/hamburger_script.js"></script>
    <script src="js/slick.min.js"></script>

</head>

<body>
    <!-- ヘッダー -->
    <header id="top">

        <div class="header_inner">
            <!-- ロゴ -->
            <a href="index.html">
                <h1 class="logo_full"><img src="img/logo_set.svg" alt="YAMATO's Factory ロゴ"></h1>
            </a>

            <!-- ナビ -->

            <!-- ②アクセシブルな名前：名前が必須のbutton要素に明示的なラベルがないのでaria-labelを付与（開く／閉じるはJSで変更）-->
            <!-- ⑥動的要素の状態：操作対象であるグロナビをaria-controlesで指定、開閉の初期状態をaria-expandedで指定-->
            <button id="hamburger" class="hamburger" aria-label="メニューを開く" aria-controls="gnav" aria-expanded="false">
                <!-- ②アクセシブルな名前,④装飾的要素：今回はbutton要素自体にaria-labelを付与しているのでラインの方は隠す -->
                <span class="hamburger__line" aria-hidden="true"></span>
            </button>

            <!-- ②アクセシブルな名前：下層にはnav要素でパンくずがあるので、aria-labelでナビゲーション名を明示 -->
            <!-- ⑥動的要素の状態：自身の開閉状態をaria-hiddenで示すが、SPレイアウトの場合のみなのでHTMLではなくJSで動的に付与 -->
            <nav id="gnav" class="gnav" aria-label="メインメニュー">
                <ul class="gnav__list">
                    <li class="gnav__item">
                        <a href="#top" class="gnav__link">作品を探す</a></li>
                    <li class="gnav__item">
                        <a href="info_first.html" class="gnav__link">はじめての方へ</a></li>
                    <li class="gnav__item">
                        <a href="info_buy.html" class="gnav__link">ご購入について</a></li>
                    <li class="gnav__item">
                        <a href="info_faq.html" class="gnav__link">お問い合わせ</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- メイン -->
    <main>
        <div class="container">
            <!-- メインビジュアル -->
            <div id="slideshow">
                <div class="your-class">
                    <div><img src="img/top_main1.jpg" alt=""></div>
                    <div><img src="img/top_main2.jpg" alt=""></div>
                    <div><img src="img/top_main3.jpg" alt=""></div>
                </div>
            </div>


            <div class="mini_container">
                <section>
                    <h2 id="color_select" class="title pic">メインカラーから選ぶ</h2>
                    <ul class="colors">
                        <li><a href="c_red_01.html"><img src="img/color/color_red.png" alt="">red</a></li>
                        <li><a href="c_orange_01.html"><img src="img/color/color_orange.png" alt="">orange</a></li>
                        <li><a href="c_yellow_01.html"><img src="img/color/color_yellow.png" alt="">yellow</a></li>
                        <li><a href="c_green_01.html"><img src="img/color/color_green.png" alt="">green</a></li>
                        <li><a href="c_blue_01.html"><img src="img/color/color_blue.png" alt="">blue</a></li>
                        <li><a href="c_lightblue_01.html"><img src="img/color/color_lightblue.png" alt="">light blue</a></li>
                        <li><a href="c_purple_01.html"><img src="img/color/color_purple.png" alt="">purple</a></li>
                        <li><a href="c_pink_01.html"><img src="img/color/color_pink.png" alt="">pink</a></li>
                        <li><a href="c_brown_01.html"><img src="img/color/color_brown.png" alt="">brown</a></li>
                        <li><a href="c_black_01.html"><img src="img/color/color_black.png" alt="">black</a></li>
                        <li><a href="c_white_01.html"><img src="img/color/color_white.png" alt="">white</a></li>
                    </ul>
                    <ul class="colors">
                        <li><a href="c_other_01.html"><img src="img/color/color_all.png" alt="">その他</a></li>
                    </ul>
                </section>

                <h2 id="t_select" class="title pic">テイストから選ぶ</h2>
                <section>
                    <div class="mini_box">
                        <ul class="taste">
                            <li style="text-align: center;">COMING SOON!!</li>
                        </ul>
                    </div>
                </section>

                <h2 id="m_select" class="title pic">モチーフから選ぶ</h2>
                <section>
                    <div class="mini_box">
                        <ul class="motif">
                            <li style="text-align: center;">COMING SOON!!</li>
                        </ul>
                    </div>
                </section>
            </div>
        </div>
    </main>


    <!-- フッター -->
    <footer>
        <!-- 各リンクアイコン -->
        <div class="link_box">
            <p class="sub_small">※各外部サイトが開きます→</p>            
            <a href="https://jp.mercari.com/user/profile/426958884">
                <img src="img/link/mercari.png" alt="メルカリへのリンク" class="link_icon"></a>
            <a href="https://x.com/yamato073">
                <img src="img/link/x.png" alt="Xへのリンク" class="link_icon"></a>
            <a href="https://www.instagram.com/yamato_hoippu">
                <img src="img/link/Instagram.png" alt="" class="link_icon"></a>
        </div>
        <div class="footer_inner"><p>&copy; YAMATO's FACTORY</p></div>
    </footer>


<!-- スライドショー（slick） -->
<script>
    $(document).ready(function(){
      $('.your-class').slick({
        dots: true,
        autoplay: true,
        autoplaySpeed: 3000
      });
    });
</script>

</body>

</html>
